name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python scripts/security_sanity.py
      - run: ruff check .
      - run: mypy redteam_harness
      - run: pytest --cov=redteam_harness --cov-report=term-missing
      - run: redteam validate config/campaign.example.yaml
      - run: REDTEAM_ALLOW_PRIVATE_NETWORKS=1 redteam run config/campaign.example.yaml --output-dir results
      - uses: actions/upload-artifact@v4
        with:
          name: redteam-reports-${{ matrix.python-version }}
          path: results/
