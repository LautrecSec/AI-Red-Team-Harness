[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-redteam-harness"
version = "1.0.0"
description = "A modular AI red-team orchestration harness for guardrail evaluation, regression testing, and normalized security reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simon Kudla" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<3",
  "types-PyYAML>=6.0.12,<7",
  "bandit>=1.8,<2",
  "pip-audit>=2.8,<3",
]

[project.scripts]
redteam = "redteam_harness.cli:main"

[tool.setuptools.packages.find]
include = ["redteam_harness*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "E501"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S108"]

[[tool.mypy.overrides]]
module = "redteam_harness.core.subprocess_plugin"
disable_error_code = ["misc"]
