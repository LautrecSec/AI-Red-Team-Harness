<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
<title id="title">AI Red Team Harness reference architecture</title>
<desc id="desc">Campaign YAML flows through a CLI, phase orchestrator and isolated plugin boundary to scanners, then normalized findings are exported as JSON, SARIF and HTML.</desc>
